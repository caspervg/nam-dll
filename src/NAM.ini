; Optional configuration file for the NAM.dll, allowing to disable individual
; features for debugging purposes. The file must be placed in the root of the
; Plugins folder to have an effect. Lines starting with semicolons are
; comments.
;
; Supported values: true or false. Unless stated otherwise, all features are activated by default.
[Admin]
; Setting this to false stops the game from loading the DLL.
Enabled=true
[NAM]
; draggable diagonal Streets
EnableDiagonalStreets=true
; no more autoconnect for Streets and RHW
DisableAutoconnect=true
; activate tunnels for Street, RHW and Lightrail
EnableTunnels=true
; reduce ferry clearance height of bridges
ReduceFerryBridgeHeight=true
; make override networks much more stable and improve performance
EnableRUL2EnginePatch=true
; slope tolerance fixes for curves and FLEX puzzle pieces
EnableNetworkSlopePatch=true
; better control for placing down FLEX puzzle pieces
EnableFlexPuzzlePiecePatch=true
; prevent eternal commuter loops between neighboring cities
EnableCommuteLoopPatch=true
; allow zones to develop along RHW networks (default: false)
EnableDirtRoadAccessPatch=false
; allow residential lots to get road access through adjacent transit-enabled lots
EnableTransitAccessPatch=true
; adjacent-carriageway handling for RHW, OWR, and NWM neighbor connections (default: false)
EnableNeighborConnectionPatch=false
; comma-separated list: RHW, OWR, NWM
NeighborConnectionNetworks=RHW,OWR,NWM
; maximum distance along the city edge when looking for a matching carriageway
NeighborConnectionMaxSearchDistance=8
; maximum empty-tile gap between carriageway bands in one group
NeighborConnectionMaxGroupingGap=2
; prevent train traffic from jumping between height levels at grade-separated crossings
EnableVerticalPathSeparationPatch=true
; allow Lightrail traffic on road networks and Monorail traffic on the rail network (default: false)
EnableDualNetworkTransitPatch=false
; add support for network items such as CAN-AM to be placed in the Water Transit or Airport menus
EnableTransportMenuPatch=true
; show the parts of puzzle piece previews that are hidden by terrain as a transparent ghost
EnableGhostPreviewPatch=true
; overlay: show hidden parts as a ghost, grading: show the terrain as it will be after placement, both: grading and overlay (default: overlay)
GhostPreviewMode=overlay
; wireframe: draw the terrain after placement as lines over the actual terrain, terrain: reshape the terrain itself
; the wireframe needs the effects from NAM's grading preview package (default: wireframe)
GhostPreviewGradingStyle=wireframe
; color of the ghost as R,G,B from 0 to 255 (default: 140,204,255)
GhostPreviewColor=140,204,255
; transparency of the ghost relative to the preview (default: 0.75)
GhostPreviewAlphaScale=0.75
; how deep in meters parts of the preview have to be hidden before they show as ghost (default: 1.0)
GhostPreviewDepthTolerance=1.0
; opacity of the outlines and wireframe of cells changed by grading, which are fainter for small changes (default: 0.4)
GhostPreviewGradingOpacity=0.4
; outline color as R,G,B of cells that are lowered by grading (default: 239,28,36, the red of the NAM hole diggers)
GhostPreviewCutColor=239,28,36
; outline color as R,G,B of cells that are raised by grading (default: 63,73,206, the blue of the NAM raisers)
GhostPreviewFillColor=63,73,206
; prevent a crash when the terrain changes under a construction piece with Subway or Pipe left behind by the Network Eraser
EnableUndergroundPlaceholderPatch=true
; keyboard shortcuts for Monorail, Onewayroad, Groundhighway and RHW
EnableKeyboardShortcuts=true
